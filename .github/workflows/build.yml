name: Build FrameBackup (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        type: choice
        default: all
        options:
          - all
          - mac
          - win
      release_tag:
        description: 'Optional release tag to attach installer (e.g. v1.4.0)'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.os_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_key: win
            os_label: Windows (.exe)
            runner: windows-latest
            build_cmd: npm run dist:win
            artifact_name: FrameBackup-Windows
            artifact_path: release/*.exe
          - os_key: mac
            os_label: macOS Apple Silicon (.dmg)
            runner: macos-14
            build_cmd: npm run dist:mac
            artifact_name: FrameBackup-macOS-arm64
            artifact_path: release/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Write Google OAuth Client Config
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_JSON" ]; then
            mkdir -p build
            printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > build/google-oauth-client.json
            echo "Wrote build/google-oauth-client.json from GitHub secret."
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_JSON secret is empty."
          fi

      - name: Build & Package Installer
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ matrix.artifact_path }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
