name: Build FrameBackup (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        type: choice
        default: all
        options:
          - all
          - mac
          - win
      release_tag:
        description: 'Optional release tag to attach installer (e.g. v1.4.0)'
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_win:
    name: Build Windows (.exe)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'win' }}
    uses: ./.github/workflows/_build-platform.yml
    secrets: inherit
    with:
      os_label: Windows (.exe)
      runner: windows-latest
      build_cmd: npm run dist:win
      artifact_name: FrameBackup-Windows
      artifact_path: release/*.exe
      release_tag: ${{ inputs.release_tag || '' }}

  build_mac:
    name: Build macOS Apple Silicon (.dmg)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'mac' }}
    uses: ./.github/workflows/_build-platform.yml
    secrets: inherit
    with:
      os_label: macOS Apple Silicon (.dmg)
      runner: macos-15-intel
      build_cmd: npm run dist:mac
      artifact_name: FrameBackup-macOS-arm64
      artifact_path: release/*.dmg
      release_tag: ${{ inputs.release_tag || '' }}
