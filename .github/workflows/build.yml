name: Build FrameBackup (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: Windows (.exe)
            runner: windows-latest
            build_cmd: npm run dist:win
            artifact_name: FrameBackup-Windows
            artifact_path: release/*.exe
          - os_label: macOS Apple Silicon (.dmg)
            runner: macos-15
            build_cmd: npm run dist:mac
            artifact_name: FrameBackup-macOS-arm64
            artifact_path: release/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Write Google OAuth Client Config
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_JSON" ]; then
            mkdir -p build
            printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > build/google-oauth-client.json
            echo "Wrote build/google-oauth-client.json from GitHub secret."
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_JSON secret is empty."
          fi

      - name: Build & Package Installer
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          generate_release_notes: true
