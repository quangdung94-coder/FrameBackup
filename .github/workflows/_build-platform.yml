name: Build Platform (Reusable)

on:
  workflow_call:
    inputs:
      os_key:
        required: true
        type: string
      os_label:
        required: true
        type: string
      runner:
        required: true
        type: string
      build_cmd:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.os_label }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Write Google OAuth Client Config
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_JSON" ]; then
            mkdir -p build
            printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > build/google-oauth-client.json
            echo "Wrote build/google-oauth-client.json from GitHub secret."
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_JSON secret is empty."
          fi

      - name: Ensure arm64 ffmpeg-static binary for macOS
        if: inputs.os_key == 'mac'
        shell: bash
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_platform=darwin npm_config_arch=arm64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg

      - name: Build & Package Installer
        run: ${{ inputs.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ inputs.artifact_path }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
